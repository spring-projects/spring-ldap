plugins {
	id 'java-platform'
}

javaPlatform {
	allowDependencies()
}


repositories {
	mavenCentral()
}

dependencies {
	if (project.hasProperty("isOverrideVersionCatalog")) {
		def springFrameworkVersion = project.property("springFrameworkVersion")
		def springDataVersion = project.property("springDataVersion")
		api platform("org.springframework:spring-framework-bom:$springFrameworkVersion")
		api platform("org.springframework.data:spring-data-bom:$springDataVersion")
	} else if (project.hasProperty("snapshot")) {
		api platform("org.springframework:spring-framework-bom:7.0.+")
		api platform("org.springframework.data:spring-data-bom:2025.0.+")
	} else {
		api platform(libs.org.springframework.spring.framework.bom)
		api platform(libs.org.springframework.data.spring.data.bom)
	}
	api platform(libs.org.springframework.security.spring.security.bom)
	api platform(libs.io.micrometer.micrometer.bom)
	api platform(libs.io.micrometer.micrometer.tracing.bom)
	api platform(libs.org.junit.junit.bom)
	api platform(libs.org.mockito.mockito.bom)
	api platform(libs.org.slf4j.slf4j.bom)
	constraints {
		api libs.com.querydsl.querydsl.core
		api libs.com.querydsl.querydsl.apt
		api libs.commons.pool.commons.pool
		api libs.org.apache.commons.commons.pool2
		api libs.ch.qos.logback.logback.classic
		api libs.com.google.code.typica.typica
		api libs.com.unboundid.unboundid.ldapsdk
		api libs.commons.codec.commons.codec
		api libs.commons.cli.commons.cli
		api libs.commons.collections.commons.collections
		api libs.commons.httpclient.commons.httpclient
		api libs.commons.io.commons.io
		api libs.commons.lang.commons.lang
		api libs.commons.logging.commons.logging
		api libs.gsbase.gsbase
		api libs.javax.activation.activation
		api libs.jdepend.jdepend
		api libs.ldapsdk.ldapsdk
		api libs.org.apache.directory.server.apacheds.core.entry
		api libs.org.apache.directory.server.apacheds.core
		api libs.org.apache.directory.server.apacheds.protocol.ldap
		api libs.org.apache.directory.server.apacheds.protocol.shared
		api libs.org.apache.directory.server.apacheds.server.jndi
		api libs.org.apache.directory.shared.shared.ldap
		api libs.org.apache.httpcomponents.httpclient
		api libs.org.aspectj.aspectjrt
		api libs.org.aspectj.aspectjweaver
		api libs.org.assertj.assertj.core
		api libs.org.easymock.easymock
		api libs.org.freemarker.freemarker
		api libs.org.hibernate.hibernate.core.jakarta
		api libs.org.hsqldb.hsqldb
		api libs.junit.junit
		api "org.mockito:mockito-core"
		api "org.mockito:mockito-junit-jupiter"
		api "org.slf4j:jcl-over-slf4j"
		api "org.slf4j:log4j-over-slf4j"
		api "org.slf4j:slf4j-api"
		api "org.slf4j:slf4j-log4j12"
		api "org.springframework.security:spring-security-config"
		api "org.springframework.security:spring-security-core"
		api "org.springframework.security:spring-security-ldap"
		api libs.org.springframework.ldap.spring.ldap.core
		api libs.log4j.log4j
		api libs.com.sun.ldapbp
	}
}
