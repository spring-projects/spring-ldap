version: 2
updates:
  - package-ecosystem: gradle
    target-branch: main
    milestone: 125 # main
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - 'type: dependency-upgrade'
      - 'in: build'
    ignore:
      - dependency-name: org.apache.directory.server:*
      - dependency-name: org.apache.directory.shared:*
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: npm
    target-branch: main
    milestone: 125 # main
    directory: /
    schedule:
      interval: weekly
    labels:
      - 'type: dependency-upgrade'
      - 'in: docs'
  - package-ecosystem: github-actions
    target-branch: main
    milestone: 125 # main
    directory: /
    schedule:
      interval: weekly
    labels:
      - 'type: task'
      - 'in: build'
    ignore:
      - dependency-name: spring-io/spring-security-release-tools/*
  - package-ecosystem: npm
    target-branch: docs-build
    directory: /
    schedule:
      interval: weekly
    labels:
      - 'type: dependency-upgrade'
      - 'in: build'
  - package-ecosystem: github-actions
    target-branch: docs-build
    directory: /
    schedule:
      interval: weekly
    labels:
      - 'type: task'
      - 'in: build'
