name: Gate
description: >
  Decides whether a downstream job should run, and reports why in the step summary.
  The calling job's id must end in '-gate' (e.g. 'artifacts-gate' becomes 'Artifacts Gate' in the summary).

inputs:
  condition:
    description: "'true' to open the gate, anything else closes it"
    required: true
  reason:
    description: >
      Reason to report, e.g. 'it is -not a snapshot build'.
      A '-word' is dropped when the gate is open and kept (minus the marker) when closed.
      A '+word' works the other way around. Unmarked words always show.
    required: true

outputs:
  gate:
    description: "'open' or 'closed'"
    value: ${{ steps.gate.outputs.gate }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      run: |
        job="${{ github.job }}"
        name=$(echo "${job%-gate}" | awk -F'-' '{for(i=1;i<=NF;i++){$i=toupper(substr($i,1,1)) substr($i,2)}; print}' OFS=' ')
        if [ "${{ inputs.condition }}" = "true" ]; then
          gate=open
          reason=$(echo "${{ inputs.reason }}" | sed -E 's/-[^ ]*[[:space:]]*//g; s/\+//g')
        else
          gate=closed
          reason=$(echo "${{ inputs.reason }}" | sed -E 's/\+[^ ]*[[:space:]]*//g; s/-//g')
        fi
        echo "gate=$gate" >> "$GITHUB_OUTPUT"
        echo "$name Gate is **${gate^^}** because $reason." >> "$GITHUB_STEP_SUMMARY"
