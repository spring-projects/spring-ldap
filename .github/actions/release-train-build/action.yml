name: Build Release
description: Builds the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@7eff154ee6dc91e101e187b61bdf592b26c637e6 # 0.0.36
    - name: Build Release
      uses: spring-io/spring-security-actions/run-gradle@7eff154ee6dc91e101e187b61bdf592b26c637e6 # 0.0.36
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: --no-build-cache -PdeploymentRepository=${{ github.workspace }}/deployment-repository publishAllPublicationsToDeploymentRepository
