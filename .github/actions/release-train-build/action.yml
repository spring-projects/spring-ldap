name: Build Release
description: Builds the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@5ad73de5732708b3915d28ec6bc3e076eff2f70d # 0.0.27
    - name: Build Release
      uses: spring-io/spring-security-actions/run-gradle@5ad73de5732708b3915d28ec6bc3e076eff2f70d # 0.0.27
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: --no-build-cache -PdeploymentRepository=${{ github.workspace }}/deployment-repository publishAllPublicationsToDeploymentRepository
