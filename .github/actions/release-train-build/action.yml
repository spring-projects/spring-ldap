name: Build Release
description: Builds the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@c8314b8f185f899b0fe7ccf07d64c7d25c4f21de # 0.0.34
    - name: Build Release
      uses: spring-io/spring-security-actions/run-gradle@c8314b8f185f899b0fe7ccf07d64c7d25c4f21de # 0.0.34
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: --no-build-cache -PdeploymentRepository=${{ github.workspace }}/deployment-repository publishAllPublicationsToDeploymentRepository
