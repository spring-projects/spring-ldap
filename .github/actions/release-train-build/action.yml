name: Build Release
description: Builds the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@4600d240d4c682ff67c25ed0d3ca57e1308694b6 # 0.0.17
    - name: Build Release
      uses: spring-io/spring-security-actions/run-gradle@4600d240d4c682ff67c25ed0d3ca57e1308694b6 # 0.0.17
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: --no-build-cache -PdeploymentRepository=${{ github.workspace }}/deployment-repository publishAllPublicationsToDeploymentRepository
