name: Release Announcements - Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish
        required: true

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  publish-release-announcements:
    name: Publish Release Announcements
    uses: spring-io/spring-security-release-tools/.github/workflows/release-announcements-publish.yml@c37f78964de4727660f708523173154903f5a272 # v1.0.21
    with:
      version: ${{ inputs.version }}
    secrets: inherit
