name: Pull Request - Build

on: pull_request

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: spring-projects/spring-ldap-commercial/.github/workflows/build-pull-request.yml@workflows/v1
    if: ${{ github.actor != 'dependabot[bot]' }}
    secrets: inherit
  build-check:
    name: Build
    needs: build
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
