name: Dependabot - Build Pull Request

on: pull_request

permissions:
  contents: read

env:
  JAVA_VERSION: '25'

jobs:
  build:
    name: Build
    runs-on: ${{ vars.UBUNTU_RUNS_ON }}
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: project-version
        name: Extract Project Version
        uses: spring-io/spring-release-actions/compute-version@3f7412aeec60ad13127b2a536a1b19a2803a5b81 # 0.0.8
      - id: release
        name: Establish Release Channel
        uses: spring-io/spring-release-actions/compute-release-channel@3f7412aeec60ad13127b2a536a1b19a2803a5b81 # 0.0.8
        with:
          version: ${{ steps.project-version.outputs.version }}
      - id: secrets
        uses: ./.github/actions/compute-secrets
        with:
          release-channel: ${{ steps.release.outputs.channel }}
      - uses: spring-io/spring-security-actions/pr-build@09c8d127933065382da35646c7d4d3a8f9352368 # 0.0.4
        env:
          ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.release.outputs.channel }}
          ORG_GRADLE_PROJECT_artifactoryUsername: ${{ secrets[steps.secrets.outputs.dependabot-username] }}
          ORG_GRADLE_PROJECT_artifactoryPassword: ${{ secrets[steps.secrets.outputs.dependabot-password] }}
        with:
          java-version: ${{ env.JAVA_VERSION }}
  build-check:
    name: Build
    needs: build
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
