name: Dependabot - Build Pull Request

on: pull_request

permissions:
  contents: read

env:
  JAVA_VERSION: '25'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: spring-io/spring-security-actions/pr-build@6edd9e68189ec4868d080ab89cf68023056f65da  # main
        with:
          java-version: ${{ env.JAVA_VERSION }}
  build-check:
    name: Build
    needs: build
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
