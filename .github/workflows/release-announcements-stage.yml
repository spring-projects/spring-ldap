name: Release Announcements - Stage

on:
  push:
    tags: '**'
  workflow_dispatch:
    inputs:
      version:
        description: The version to stage
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage-release-announcements:
    name: Stage Release Announcements
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: read
    uses: spring-io/spring-security-release-tools/.github/workflows/release-announcements-stage.yml@1c4903f876627b48871a3063857ebf6048b83697 # v1.1.2-SNAPSHOT
    with:
      version: ${{ inputs.version || github.ref_name }}
    secrets: inherit
